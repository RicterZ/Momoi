services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "3001:3001"
      - "6099:6099"
    volumes:
      - napcat-qq:/app/.config/QQ

  momoi:
    image: ricterz/momoi:0.4.0
    container_name: momoi
    restart: unless-stopped
    depends_on:
      - napcat
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MOMOI_LLM_API_FORMAT: ${MOMOI_LLM_API_FORMAT:-}
      MOMOI_LLM_BASE_URL: ${MOMOI_LLM_BASE_URL}
      MOMOI_LLM_API_KEY: ${MOMOI_LLM_API_KEY}
      MOMOI_LLM_MODEL: ${MOMOI_LLM_MODEL}
      MOMOI_OWNER_QQ: ${MOMOI_OWNER_QQ:-}
      MOMOI_NAPCAT_URL: ${MOMOI_NAPCAT_URL:-ws://napcat:3001}
      MOMOI_PRIMARY: ${MOMOI_PRIMARY:-}
      MOMOI_TIMEZONE: ${TZ:-Asia/Shanghai}
      MOMOI_DASHBOARD_TOKEN: ${MOMOI_DASHBOARD_TOKEN:-}
      MOMOI_WEBHOOKS_ENABLED: ${MOMOI_WEBHOOKS_ENABLED:-true}
      MOMOI_WEBHOOKS_HOST: ${MOMOI_WEBHOOKS_HOST:-0.0.0.0}
      MOMOI_WEBHOOKS_TOKEN: ${MOMOI_WEBHOOKS_TOKEN:-}
      MOMOI_USAGE_API_KEY: ${MOMOI_USAGE_API_KEY:-}
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ${MOMOI_WORKSPACE:-${HOME}/.momoi}:/home/momoi/.momoi

volumes:
  napcat-qq:
