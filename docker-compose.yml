services:
  embedding:
    image: ricterz/momoi-embedding:latest
    container_name: momoi-embedding
    restart: unless-stopped

  momoi:
    image: ricterz/momoi:latest
    container_name: momoi
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MOMOI_TIMEZONE: ${TZ:-Asia/Shanghai}
      MOMOI_DASHBOARD_TOKEN: ${MOMOI_DASHBOARD_TOKEN:-}
    depends_on:
      - embedding
    ports:
      - "${MOMOI_DASHBOARD_PORT:-8788}:8788"
    volumes:
      - ${MOMOI_WORKSPACE:-${HOME}/.momoi}:/home/momoi/.momoi
