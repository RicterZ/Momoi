services:
  embedding:
    image: ricterz/momoi-embedding:latest
    profiles: [embedding]
    container_name: momoi-embedding
    restart: unless-stopped

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    profiles: [qq]
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "3001:3001"
      - "6099:6099"
    volumes:
      - napcat-qq:/app/.config/QQ

  momoi:
    image: ricterz/momoi:latest
    container_name: momoi
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MOMOI_TIMEZONE: ${TZ:-Asia/Shanghai}
      MOMOI_DASHBOARD_TOKEN: ${MOMOI_DASHBOARD_TOKEN:-}
    ports:
      - "${MOMOI_DASHBOARD_PORT:-8788}:8788"
    volumes:
      - ${MOMOI_WORKSPACE:-${HOME}/.momoi}:/home/momoi/.momoi

volumes:
  napcat-qq:
