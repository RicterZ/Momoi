[program:qq-call-audio]
command=bash /opt/qq-call/infra/service.sh audio
user=snowluma
priority=5
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qq-call-av-host]
command=bash /opt/qq-call/infra/service.sh av-host
user=snowluma
priority=15
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qq-call-broker]
command=bash /opt/qq-call/infra/service.sh broker
user=snowluma
priority=25
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
