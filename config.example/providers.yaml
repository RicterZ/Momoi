# External services. Restart Momoi after changing this file.
version: 1
credentials:
  model:
    api_key: replace-me
  tencent:
    secret_id:
      env: TENCENT_SECRET_ID
    secret_key:
      env: TENCENT_SECRET_KEY
  fish:
    api_key:
      env: FISH_API_KEY
  deepseek:
    api_key:
      env: DEEPSEEK_API_KEY
services:
  chat:
    adapter: anthropic
    base_url: https://api.example.com
    credentials: model
    timeout_seconds: 300
  speech_recognition:
    adapter: tencent
    credentials: tencent
    timeout_seconds: 30
  speech:
    adapter: fish
    credentials: fish
    base_url: https://api.fish.audio
    timeout_seconds: 60
  vectors:
    adapter: openai
    base_url: http://embedding:8002/v1
  deepseek_account:
    adapter: deepseek
    credentials: deepseek
    base_url: https://api.deepseek.com
    timeout_seconds: 10
bindings:
  llm:
    service: chat
    options:
      model: model-name
      max_tokens: 16384
      temperature: 0.6
      max_retries: 3
      tool_choice: false
      thinking:
        effort: high
        stages:
          episode_anneal: low
          memory_maintenance: low
          reply_followup: low
  asr:
    service: speech_recognition
    enabled: false
    options:
      engine: 16k_zh
      region: ''
      max_audio_bytes: 3145728
  tts:
    service: speech
    enabled: false
    options:
      model: s2.1-pro-free
      reference_id: 9bb8ad542dc44d148c21c73a0884e9ae
      format: mp3
      latency: normal
      max_audio_bytes: 20971520
  embedding:
    service: vectors
    enabled: false
    options:
      model: BAAI/bge-small-zh-v1.5
      dimensions: 512
      calibration_profile: bge-small-zh-v1.5-momoi-v1
      query_timeout_seconds: 5
      document_timeout_seconds: 30
      document_batch_size: 8
  balance:
    service: deepseek_account
    enabled: false
