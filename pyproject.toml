[project]
name = "momoi"
version = "1.1.2"
description = "A headless, single-owner personal agent daemon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "cryptography>=44,<50",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "numpy>=2.1,<3",
    "tzdata>=2025.1; sys_platform == 'win32'",
    "PyYAML>=6.0,<7",
    "pydantic>=2.0,<3",
    "qrcode>=8,<9",
    "jsonschema>=4.23,<5",
    "markdownify>=1.2,<2",
    "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
desktop = [
    "fastapi==0.135.1",
    "fastembed==0.8.0",
    "huggingface-hub==1.7.2",
    "uvicorn==0.41.0",
]

[project.scripts]
momoi = "momoi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/momoi/dashboard/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/momoi"]

[dependency-groups]
windows-build = [
    "pillow>=12,<13",
]

test = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
]
