[project]
name = "momoi"
version = "0.1.0"
description = "A headless, single-owner agent daemon for QQ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
momoi = "momoi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momoi"]
