[project]
name = "momoi"
version = "0.5.1"
description = "A headless, single-owner personal agent daemon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "cryptography>=44,<50",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "numpy>=2.1,<3",
    "PyYAML>=6.0,<7",
    "qrcode>=8,<9",
]

[project.scripts]
momoi = "momoi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momoi"]
