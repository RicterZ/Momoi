name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (default: project version)"
        default: ""
        required: false
      qq_components_run:
        description: "Seed locked QQ component cache from an existing build run"
        default: ""
        required: false
      installer_run:
        description: "Reuse an existing Windows installer artifact for installation diagnostics"
        default: ""
        required: false
      download_qq:
        description: "Verify downloading the pinned QQ components from COS instead of using components/"
        type: boolean
        default: false
      download_prerequisites:
        description: "Force verifying the pinned VC++ download and installation path"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $Version = $env:RELEASE_TAG -replace '^v', ''
            if ($Version -notmatch '^\d+\.\d+\.\d+(?:[.-][A-Za-z0-9.-]+)?$') {
              throw "Release tag must be a version such as v1.1.0: $env:RELEASE_TAG"
            }
            "value=$Version" >> $env:GITHUB_OUTPUT
          } elseif ($env:BUILD_VERSION) {
            if ($env:BUILD_VERSION -notmatch '^\d+\.\d+\.\d+(?:[.-][A-Za-z0-9.-]+)?$') { throw "Invalid build version" }
            "value=$env:BUILD_VERSION" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/cache@v4
        with:
          path: |
            build/windows-downloads
            models
            build/local-asr/model.tar.bz2
            build/windows-asr-wheels
          key: windows-inputs-v1-${{ hashFiles('packaging/windows/components.json', 'packaging/windows/qq-pair.lock.json', 'packaging/prepare_embedding.py', 'packaging/prepare_asr.py', 'packaging/asr-model.json', 'src/momoi/integrations/adapters/local_embedding.py') }}
      - uses: actions/cache@v4
        id: qq-cache
        with:
          path: build/windows-qq-cache
          key: windows-qq-pair-v1-${{ hashFiles('packaging/windows/qq-pair.lock.json', 'packaging/windows/qq_components.iss', 'packaging/windows/prepare_installer_files.py', 'packaging/windows/prepare_napcat.py', 'packaging/windows/prepare_qq_call.py', 'packaging/windows/prepare_qq_pair.py', 'LICENSE') }}
      - uses: actions/download-artifact@v4
        if: inputs.qq_components_run != '' && steps.qq-cache.outputs.cache-hit != 'true'
        with:
          name: Momoi-Windows-x64
          path: build/qq-component-seed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qq_components_run }}
      - name: Seed locked component cache
        if: inputs.qq_components_run != '' && steps.qq-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/windows-qq-cache -Force | Out-Null
          Copy-Item build/qq-component-seed/components/Momoi-QQ-Components-*.exe build/windows-qq-cache/
          Copy-Item build/qq-component-seed/components/Momoi-QQ-Components-*.json build/windows-qq-cache/
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Locked Python test environment
        run: uv sync --locked --python 3.12 --group test
      - name: Windows shell, process tree and workspace tests
        run: uv run --locked --group test pytest -q -n 0 tests/test_platform.py tests/test_exec_tool.py tests/test_desktop.py tests/test_desktop_qq.py tests/test_desktop_emotions.py tests/test_windows_media_lifecycle.py tests/test_desktop_qq_call_settings.py tests/test_qq_call_audio.py tests/test_qq_call_configuration.py tests/test_qq_call_streaming.py tests/test_qq_call_client.py tests/test_qq_call_packaging.py tests/test_sherpa_asr.py tests/test_windows_cos_publish.py tests/test_windows_installer_files.py tests/test_windows_installer_package.py tests/test_windows_python_trim.py
      - name: Update validation checks
        run: dotnet run --project desktop/Momoi.Update.Check -c Release
      - name: Native QQ library and isolated data smoke
        if: inputs.installer_run == ''
        shell: pwsh
        run: |
          uv run --locked --group test python packaging/windows/prepare_napcat.py --stage build/qq-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --group test python packaging/windows/smoke_napcat.py --runtime build/qq-smoke/runtime/napcat
      - name: Build installer and smoke private runtime
        if: inputs.installer_run == ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/windows/build.ps1 -Version $env:RELEASE_VERSION
      - name: Build independent shell update
        if: inputs.installer_run == ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $Version = $env:RELEASE_VERSION
          if (-not $Version) { $Version = (& uv run --no-sync python -c "import importlib.metadata; print(importlib.metadata.version('momoi'))").Trim() }
          uv run --no-sync python packaging/windows/build_shell.py --version $Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native shell replacement and rollback smoke
        if: inputs.installer_run == ''
        shell: pwsh
        run: |
          $Archive = (Get-ChildItem dist/windows/shell/Momoi-Shell-*-x64.zip | Select-Object -First 1).FullName
          $Shell = (Resolve-Path dist/windows/shell/payload/Momoi.exe).Path
          $Process = Start-Process $Shell -ArgumentList @('--update-shell-smoke', ('"' + $Archive + '"')) -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Shell update smoke failed; inspect $Archive.smoke-error.log" }
          Get-Content "$Archive.smoke.json"
      - name: Native application update overlay smoke
        if: inputs.installer_run == ''
        shell: pwsh
        run: |
          $Shell = (Resolve-Path dist/windows/shell/payload/Momoi.exe).Path
          $Directory = Join-Path $env:GITHUB_WORKSPACE 'build/windows-prompt-smoke'
          $Process = Start-Process $Shell -ArgumentList @('--update-prompt-smoke', ('"' + $Directory + '"')) -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Update prompt smoke failed; inspect $Directory/prompt-error.log" }
          Get-Content "$Directory/prompt-smoke.json"
      - uses: actions/download-artifact@v4
        if: inputs.installer_run != ''
        with:
          name: Momoi-Windows-x64
          path: dist/windows
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
      - name: Real installer, reinstall and uninstall test
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem dist/windows/Momoi-Setup-*-x64.exe | Select-Object -First 1).FullName
          $DownloadQQ = '${{ inputs.download_qq }}' -eq 'true'
          $DownloadPrerequisites = '${{ inputs.download_prerequisites }}' -eq 'true'
          ./packaging/windows/smoke_install.ps1 -Installer $Installer -DownloadQQComponents:$DownloadQQ -DownloadPrerequisites:$DownloadPrerequisites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Momoi-Windows-x64
          path: |
            dist/windows/Momoi-Setup-*-x64.exe
            dist/windows/Momoi-Online-Setup-*-x64.exe
            dist/windows/Momoi-Online-Setup-*-x64.json
            dist/windows/components/Momoi-ASR-Components-*-x64.exe
            dist/windows/components/Momoi-ASR-Components-*-x64.json
            dist/windows/components/Momoi-QQ-Components-*-x64.exe
            dist/windows/components/Momoi-QQ-Components-*-x64.json
            dist/windows/Momoi-Windows-*-x64.zip
            dist/windows/releases/Momoi-Code-*.zip
            dist/windows/releases/runtime.json
            dist/windows/shell/Momoi-Shell-*-x64.zip
            dist/windows/components/prerequisites/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Momoi-Windows-diagnostics
          path: |
            dist/windows/install-test/
            build/windows-installer-files.json
            build/windows-python-trim.json
            build/windows-prompt-smoke/
          if-no-files-found: ignore

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Momoi-Windows-x64
          path: dist/windows
      - name: Attach tested installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/windows/Momoi-Setup-*-x64.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one tested Windows installer" >&2
            exit 1
          fi
          python packaging/windows/package_installer.py --directory dist/windows --version "${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "dist/windows/Momoi-Windows-${RELEASE_TAG#v}-x64.zip" "dist/windows/Momoi-Online-Setup-${RELEASE_TAG#v}-x64.exe" --clobber
