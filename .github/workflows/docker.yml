name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag besides latest
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            models
            build/local-asr/model.tar.bz2
            ~/.cache/huggingface
          key: models-v1-${{ hashFiles('packaging/prepare_embedding.py', 'packaging/prepare_asr.py', 'packaging/asr-model.json', 'src/momoi/integrations/adapters/local_embedding.py') }}
      - name: Prepare bundled models
        run: |
          uv run --locked python packaging/prepare_embedding.py
          uv run --locked python packaging/prepare_asr.py

      - name: Image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.tag }}"
          fi
          tags="ricterz/momoi:latest"
          if [ -n "$version" ]; then
            tags="$tags,ricterz/momoi:$version"
          fi
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ricterz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ricterz
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ricterz/momoi
          short-description: A persistent personal AI companion for private chat.
          readme-filepath: ./docker/README.md
