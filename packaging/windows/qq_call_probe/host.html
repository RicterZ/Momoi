<!doctype html><meta charset="utf-8">
<embed id="avsdk" type="application/x-ppapi-avSDK" width="1" height="1">
<script>
const { ipcRenderer } = require('electron');
setTimeout(() => {
  const plugin = document.getElementById('avsdk');
  const methods = ['postMessage', 'login', 'acceptInvite', 'openMic', 'closeMic', 'startTRAEAudio'];
  ipcRenderer.send('probe-result', { postMessage: typeof plugin.postMessage === 'function', methods: Object.fromEntries(methods.map(name => [name, typeof plugin[name]])) });
}, 8000);
</script>
